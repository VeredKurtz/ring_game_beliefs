services:
  - type: web
    name: ringgame-belief-pilot
    runtime: python
    plan: 0.5c-512mb
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: ringgame-data
      mountPath: /var/data
      sizeGB: 1
